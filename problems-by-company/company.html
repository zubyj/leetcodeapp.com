<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problems by Company - Leetcode Explained</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon-16.png" sizes="16x16">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="company.css">
    <link rel="stylesheet" href="../components/navbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Include the shared navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container">
        <section class="title-section text-center">
            <h1 class="display-4">Problems by Company</h1>
            <p class="lead">Find coding problems asked by top tech companies</p>
        </section>

        <!-- Title Section -->
        <section class="text-center mb-5">
            <h1 class="display-4 mb-3" id="title">Company Interview Problems</h1>
            <p class="lead text-muted">
                Explore coding problems asked by top tech companies in their interviews.
                Practice the most frequently asked questions to prepare for your next interview.
            </p>
        </section>

        <!-- Company Navigation -->
        <section class="company-nav mb-5">
            <button onclick="selectCompany('Google')" class="btn btn-outline-light" data-company="Google">
                <i class="fab fa-google"></i> Google
            </button>
            <button onclick="selectCompany('Meta')" class="btn btn-outline-light" data-company="Meta">
                <i class="fab fa-facebook"></i> Meta
            </button>
            <button onclick="selectCompany('Amazon')" class="btn btn-outline-light" data-company="Amazon">
                <i class="fab fa-amazon"></i> Amazon
            </button>
            <button onclick="selectCompany('Microsoft')" class="btn btn-outline-light" data-company="Microsoft">
                <i class="fab fa-microsoft"></i> Microsoft
            </button>
            <button onclick="selectCompany('Apple')" class="btn btn-outline-light" data-company="Apple">
                <i class="fab fa-apple"></i> Apple
            </button>
        </section>

        <!-- Search -->
        <section class="search-section mb-5">
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text bg-dark border-0">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                </div>
                <input type="text" id="companySearch" list="companyList" 
                       class="form-control bg-dark border-0 text-light"
                       placeholder="Search for a company...">
                <datalist id="companyList"></datalist>
            </div>
        </section>

        <!-- Table -->
        <section class="table-responsive">
            <table class="table table-dark table-hover problems-table" id="solutionTable">
                <thead>
                    <tr>
                        <th class="header" id="#">
                            <i class="fas fa-hashtag"></i> #
                        </th>
                        <th class="header" id="Difficulty">
                            <i class="fas fa-signal"></i> Difficulty
                        </th>
                        <th class="header" id="Title">
                            <i class="fas fa-code"></i> Title
                        </th>
                        <th class="header" id="Acceptance">
                            <i class="fas fa-check-circle"></i> Acceptance
                        </th>
                        <th class="header" id="Rank">
                            <i class="fas fa-star"></i> Rank
                        </th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
    <script>
        // Load the shared navbar
        fetch('/components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
                // Add active class to the current page's nav item
                document.querySelector('a[href="/problems-by-company/company.html"]').classList.add('active');
            });
    </script>
    <script src="company.js"></script>
</body>
</html>
